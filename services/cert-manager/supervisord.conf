# Keep process prefixes while bounding the local log files and reader allocations.

[supervisord]
nodaemon=true # start in foreground
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
priority=100 # lower start first

[program:cert-manager]
directory=/app
command=uv run src/cert_manager/main.py
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cert-manager.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
priority=200

[program:proc-logger]
directory=/app
command=uv run proc_logger.py
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=300

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
